[libdefaults]
  default_realm = CERN.CH
  ticket_lifetime = 24h
  renew_lifetime = 7d
  forwardable = true
  proxiable = true
  # Without this, GSSAPI canonicalizes the target hostname via a reverse
  # DNS lookup on the connected IP before building the service principal
  # name for the AP-REQ -- if that PTR record differs from the hostname in
  # target_url (as it does here: os-search-atlas-physics-dev.cern.ch's TLS
  # cert itself shows CN=oscqa301.cern.ch, a different canonical name for
  # the same host), curl builds an SPN the server's keytab was never
  # issued for, and Apache's mod_auth_gssapi rejects the negotiate with a
  # 401 despite an otherwise-valid ticket. Both settings are set for
  # compatibility across krb5 library versions that only honor one name
  # for this behavior.
  rdns = false
  dns_canonicalize_hostname = false

[realms]
  CERN.CH = {
    default_domain = cern.ch
    kpasswd_server = afskrb5m.cern.ch
    admin_server = afskrb5m.cern.ch
    kdc = cerndc.cern.ch
  }

[domain_realm]
  cern.ch = CERN.CH
  .cern.ch = CERN.CH
